<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Music Player</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #1db954;
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; font-size: 1.4rem; }
        #current-track {
            margin: 15px 0;
            color: var(--accent-color);
            font-weight: bold;
            word-wrap: break-word;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .shuffle-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .shuffle-btn:active {
            transform: scale(0.98);
        }
        .playlist {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            background: var(--card-color);
            border-radius: 15px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .track-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item:hover, .track-item.active {
            background-color: #282828;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Now Playing</h2>
        <div id="current-track">No song selected</div>
        <audio id="audio-player" controls></audio>
        <button class="shuffle-btn" id="shuffle-btn">🔀 Shuffle Play</button>
    </div>

    <div class="playlist" id="playlist">
        Loading your tracks...
    </div>

    <script>
        // CHANGE THESE TWO LINES TO MATCH YOUR GITHUB FOR IT TO AUTO-SCAN
        const githubUsername = "abd2re";
        const repoName = "abd2re.github.io";
        
        const folderPath = "music"; 

        const audioPlayer = document.getElementById('audio-player');
        const currentTrackDiv = document.getElementById('current-track');
        const playlistDiv = document.getElementById('playlist');
        const shuffleBtn = document.getElementById('shuffle-btn');

        let songsList = []; // Global array to hold our filtered song data

        // Fetch the file list from GitHub's Public API
        async function loadSongs() {
            const apiUrl = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/${folderPath}`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Could not fetch music folder.');
                
                const files = await response.json();
                
                // Filter out anything that isn't an MP3
                songsList = files.filter(file => file.name.toLowerCase().endsWith('.mp3'));

                if(songsList.length === 0) {
                    playlistDiv.innerHTML = '<div class="track-item">No .mp3 files found in /music/</div>';
                    return;
                }

                playlistDiv.innerHTML = ''; // Clear loading text

                songsList.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.classList.add('track-item');
                    item.id = `track-${index}`; // Give each track an ID to find it later
                    item.textContent = file.name.replace(/\.mp3$/i, ''); 
                    
                    item.addEventListener('click', () => {
                        playSong(index);
                    });
                    
                    playlistDiv.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                playlistDiv.innerHTML = '<div class="track-item" style="color:red;">Error loading songs. Check settings.</div>';
            }
        }

        function playSong(index) {
            if (songsList.length === 0) return;

            const song = songsList[index];

            // Remove active style from all items
            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
            
            // Add active style to current item
            const currentElement = document.getElementById(`track-${index}`);
            if (currentElement) {
                currentElement.classList.add('active');
                currentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Update player and play
            currentTrackDiv.textContent = song.name.replace(/\.mp3$/i, '');
            audioPlayer.src = song.download_url;
            audioPlayer.play();
        }

        function playRandomSong() {
            if (songsList.length === 0) return;
            const randomIndex = Math.floor(Math.random() * songsList.length);
            playSong(randomIndex);
        }

        // EVENT LISTENERS

        // 1. Automatically play a random song when the current one ends
        audioPlayer.addEventListener('ended', () => {
            playRandomSong();
        });

        // 2. Shuffle button click handler
        shuffleBtn.addEventListener('click', () => {
            playRandomSong();
        });

        // Initialize on page load
        loadSongs();
    </script>
</body>
</html>
