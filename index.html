<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Music Player</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #1db954;
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; font-size: 1.4rem; }
        #current-track {
            margin: 15px 0;
            color: var(--accent-color);
            font-weight: bold;
            word-wrap: break-word;
            min-height: 1.2rem;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.mode-active {
            background-color: var(--accent-color);
        }
        .playlist {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            background: var(--card-color);
            border-radius: 15px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .track-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item:hover, .track-item.active {
            background-color: #282828;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Now Playing</h2>
        <div id="current-track">No song selected</div>
        <audio id="audio-player" controls></audio>
        
        <div class="controls">
            <button class="btn" id="prev-btn">⏮️ Prev</button>
            <button class="btn mode-active" id="mode-btn">➡️ Sequential</button>
            <button class="btn" id="next-btn">⏭️ Next</button>
        </div>
    </div>

    <div class="playlist" id="playlist">
        Loading your tracks...
    </div>

    <script>
        // CHANGE THESE TWO LINES TO MATCH YOUR GITHUB FOR IT TO AUTO-SCAN
        const githubUsername = "abd2re";
        const repoName = "abd2re.github.io";
        
        const folderPath = "music"; 

        const audioPlayer = document.getElementById('audio-player');
        const currentTrackDiv = document.getElementById('current-track');
        const playlistDiv = document.getElementById('playlist');
        const modeBtn = document.getElementById('mode-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let songsList = []; 
        let currentIndex = -1;
        let playbackHistory = []; 

        // True Shuffle State Variables
        let shuffledOrder = [];    // Holds indices in a scrambled order
        let shuffleIndex = -1;     // Where we currently are inside the scrambled deck

        // Playback Modes: 'sequential', 'random', 'repeat'
        const modes = ['sequential', 'random', 'repeat'];
        const modeLabels = {
            sequential: "➡️ Sequential",
            random: "🔀 Random",
            repeat: "🔁 Repeat One"
        };
        let currentModeIndex = 0; 

        // Fetch the file list from GitHub's Public API
        async function loadSongs() {
            const apiUrl = `https://api.github.com/repos/${githubUsername}/${repoName}/contents/${folderPath}`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Could not fetch music folder.');
                
                const files = await response.json();
                songsList = files.filter(file => file.name.toLowerCase().endsWith('.mp3'));

                if(songsList.length === 0) {
                    playlistDiv.innerHTML = '<div class="track-item">No .mp3 files found in /music/</div>';
                    return;
                }

                playlistDiv.innerHTML = ''; 

                songsList.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.classList.add('track-item');
                    item.id = `track-${index}`; 
                    item.textContent = file.name.replace(/\.mp3$/i, ''); 
                    
                    item.addEventListener('click', () => {
                        // When user manually picks a song, break out of shuffle sequence tracker
                        shuffleIndex = -1; 
                        playSong(index, true);
                    });
                    
                    playlistDiv.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                playlistDiv.innerHTML = '<div class="track-item" style="color:red;">Error loading songs. Check settings.</div>';
            }
        }

        // Generate a completely scrambled deck of numbers
        function generateShuffleOrder() {
            if (songsList.length === 0) return;
            
            // Start with an ordered list: [0, 1, 2, 3...]
            shuffledOrder = Array.from({length: songsList.length}, (_, i) => i);
            
            // Fisher-Yates Shuffle Algorithm (perfect modern scramble)
            for (let i = shuffledOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
            }
            
            shuffleIndex = 0;
        }

        function playSong(index, clearHistoryForward = false) {
            if (songsList.length === 0) return;

            if (clearHistoryForward && currentIndex !== -1 && currentIndex !== index) {
                playbackHistory.push(currentIndex);
            }

            currentIndex = index;
            const song = songsList[index];
            const songName = song.name.replace(/\.mp3$/i, '');

            // Update UI Active States
            document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
            const currentElement = document.getElementById(`track-${index}`);
            if (currentElement) {
                currentElement.classList.add('active');
                currentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Update HTML Audio element
            currentTrackDiv.textContent = songName;
            audioPlayer.src = song.download_url;
            audioPlayer.play();

            // Windows 10 Overlay Sync
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songName,
                    artist: 'My GitHub Playlist',
                    album: modeLabels[modes[currentModeIndex]]
                });
                updateMediaSessionHandlers();
            }
        }

        function handleNextTrack() {
            if (songsList.length === 0) return;
            
            const currentMode = modes[currentModeIndex];

            if (currentMode === 'repeat' && currentIndex !== -1) {
                playSong(currentIndex, false);
            } 
            else if (currentMode === 'random') {
                // If deck isn't generated or we reached the end of our deck, re-shuffle
                if (shuffledOrder.length !== songsList.length || shuffleIndex === -1 || shuffleIndex >= shuffledOrder.length) {
                    generateShuffleOrder();
                }
                
                const nextSongIndex = shuffledOrder[shuffleIndex];
                shuffleIndex++; // Move pointer forward in the scrambled deck
                playSong(nextSongIndex, true);
            } 
            else {
                // Sequential Play
                let nextIndex = currentIndex + 1;
                if (nextIndex >= songsList.length) nextIndex = 0;
                playSong(nextIndex, true);
            }
        }

        function handlePrevTrack() {
            // If we have back-history tracked locally, respect it
            if (playbackHistory.length > 0) {
                const prevIndex = playbackHistory.pop();
                
                // If we are currently in shuffle mode, try to reverse our deck pointer as well
                if (modes[currentModeIndex] === 'random' && shuffleIndex > 0) {
                    shuffleIndex--;
                }
                
                playSong(prevIndex, false);
            } else {
                // Fallback loop logic if history is clean
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) prevIndex = songsList.length - 1;
                playSong(prevIndex, false);
            }
        }

        function toggleMode() {
            currentModeIndex = (currentModeIndex + 1) % modes.length;
            const newMode = modes[currentModeIndex];
            modeBtn.textContent = modeLabels[newMode];
            
            // Force a clean card layout scramble if switching to random right now
            if (newMode === 'random') {
                generateShuffleOrder();
            }
            
            if (currentIndex !== -1 && 'mediaSession' in navigator) {
                navigator.mediaSession.metadata.album = modeLabels[newMode];
            }
        }

        function updateMediaSessionHandlers() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
                navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => handlePrevTrack());
                navigator.mediaSession.setActionHandler('nexttrack', () => handleNextTrack());
            }
        }

        // EVENT LISTENERS
        audioPlayer.addEventListener('ended', () => handleNextTrack());
        modeBtn.addEventListener('click', () => toggleMode());
        nextBtn.addEventListener('click', () => handleNextTrack());
        prevBtn.addEventListener('click', () => handlePrevTrack());

        // Initialize on page load
        loadSongs();
    </script>
</body>
</html>
